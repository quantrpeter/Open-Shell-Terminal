appId: dev.openshell.terminal
productName: Open Shell Terminal
directories:
  output: dist
files:
  - out/**
  - package.json
# resources/python is the per-OS standalone CPython runtime, fetched at release time.
extraResources:
  - from: resources/engine
    to: engine
  - from: resources/python
    to: python
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  # Local keychain has no usable Developer ID. CSC_LINK / CSC_NAME still override this.
  identity: null
win:
  target: [nsis]
linux:
  category: Utility
  target: [AppImage, deb]
